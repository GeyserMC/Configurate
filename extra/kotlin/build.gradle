import dev.detekt.gradle.Detekt
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
    alias(libs.plugins.kotlin)
    alias(libs.plugins.dokka)
    alias(libs.plugins.dokka.javadoc)
    alias(libs.plugins.detekt)
    id 'org.spongepowered.configurate.build.component'
}

description = "Kotlin API support for Configurate"

sourceSets {
    register('examples') {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

dependencies {
    examplesImplementation sourceSets.named('main').map { it.output }
    examplesImplementation projects.format.yaml
}

tasks.withType(JavaCompile).configureEach {
    targetCompatibility = JvmTarget.JVM_9.target
}

kotlin {
    // The minimum Kotlin version consumers of this module need
    coreLibrariesVersion = "2.0.21"
    compilerOptions {
        jvmTarget = JvmTarget.JVM_9
        languageVersion = KotlinVersion.KOTLIN_2_0
        apiVersion = KotlinVersion.KOTLIN_2_0
        freeCompilerArgs.addAll(
            "-Xemit-jvm-type-annotations",
            // The 2.0 floor is intentional, so don't warn that it's deprecated
            "-Xsuppress-version-warnings"
        )
    }
}

javadocJar.configure {
    from(tasks.named('dokkaGeneratePublicationJavadoc'))
}

dokka {
    moduleName = "configurate-${project.name}"
    dokkaSourceSets.configureEach {
        includes.from(file("src/main/packages.md"))
        samples.from(kotlin.sourceSets.named("examples").map {
            it.kotlin.sourceDirectories
        })
        jdkVersion = 9
        reportUndocumented = true
    }
}

tasks.withType(Detekt).configureEach {
    config.setFrom(rootProject.file(".detekt/detekt.yml"))
}

dependencies {
    api projects.core
    implementation libs.kotlin.reflect
    // This version has to be kept in sync with coreLibrariesVersion
    implementation libs.kotlin.coroutines
}
